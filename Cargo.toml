[package]
name = "adviverse-api"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "Programmatic surface for the Adviverse dashboard — advertiser, publisher, finance, deals, reporting and admin endpoints. Authenticate with a session bearer token or a scoped API key (x-api-key: ak_<prefix>.<secret>)."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", features = ["json", "multipart"] }
